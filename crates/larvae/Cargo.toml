[package]
name = "larvae"
description = "Format, lint, and ship Luau"
keywords = ["luau", "roblox", "toolchai", "rojo", "require"]
categories = ["development-tools::build-utils", "command-line-utilities"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
# The repo root files are symlinked in, since cargo cannot package above the
# crate directory and GitHub wants them at the root
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE.md",
    "CHANGELOG.md",
    "larvae.schema.json",
    "assets/larvae.png",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
json5 = "0.4"
mlua = { version = "0.12.0", features = ["luau", "vendored", "error-send", "serialize"] }
notify-debouncer-full = "0.7.0"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11.0"
terminal_size = "0.4"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
walkdir = "2"
# Worm host. Trimmed hard: wat parses the text format we never see, memory64 is
# unused, and validate stays because worm modules come from a URL. Measured, the
# default feature set costs 830KB more than this one.
wasmi = { version = "2.0.0-beta.9", default-features = false, features = ["std", "validate", "stable", "auto-dispatch"] }
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
