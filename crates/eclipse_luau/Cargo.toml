[package]
name = "eclipse_luau"
version = "0.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/larvae-luau/larvae"
homepage = "https://github.com/larvae-luau/larvae"
description = "A small, fast Luau lexer, parser, and lossless printer with byte-range identity"

[dependencies]
rayon = "1"
full_moon = { version = "2", optional = true, features = ["luau"] }

[features]
full-moon-bench = ["dep:full_moon"]

[dev-dependencies]
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "parse"
harness = false

[[bench]]
name = "against_full_moon"
harness = false
