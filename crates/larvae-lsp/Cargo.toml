[package]
name = "larvae-lsp"
version.workspace = true
edition = "2024"
license = "MIT"
repository = "https://github.com/larvae-luau/larvae"
homepage = "https://github.com/larvae-luau/larvae"
description = "The larvae language server, with Luau's analysis frontend behind a feature"

[dev-dependencies]
tempfile = "3"

[dependencies]
anyhow = "1"
# The vendored Roblox reference ships deflated; 438KB rather than 3.7MB.
flate2 = "1"
larvae = { path = "../larvae" }
json5 = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
cc = { version = "1", optional = true }

[features]
# The analyzer compiles the vendored Luau C++, which takes real time. The
# feature keeps a plain workspace build fast; the shipped binary turns it on.
analyzer = ["dep:cc"]
