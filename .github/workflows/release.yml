name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cheap and first: a tag that disagrees with Cargo.toml would publish the
  # wrong version to crates.io, where it cannot be taken back.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="larvae") | .version')

          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset is what `self update` looks for, it is larvae-{os}-{arch}
          # spelled exactly as std::env::consts reports them at runtime
          # `analyzer` builds the vendored Luau C++ into larvae-lsp. It is on
          # wherever the runner can produce that target's C++. A target that
          # turns it off still ships a server: `larvae lsp` lints and formats,
          # and the editor falls back to it. Turning one off is one line here
          # and costs that platform hover and completion, not the release.
          # gnu and not musl: the analyzer is a shared library the server
          # opens at runtime, and a static musl binary cannot dlopen. The
          # build passed and the carries-the-analyzer check caught it.
          - asset: larvae-linux-x86_64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            analyzer: true
            native: true
          - asset: larvae-linux-aarch64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
            analyzer: true
            native: true
          - asset: larvae-macos-x86_64
            target: x86_64-apple-darwin
            runs-on: macos-latest
            analyzer: true
            native: false
          - asset: larvae-macos-aarch64
            target: aarch64-apple-darwin
            runs-on: macos-latest
            analyzer: true
            native: true
          - asset: larvae-windows-x86_64
            target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            analyzer: true
            native: true
          # The runner is x86_64 and the target is not, so this one asks MSVC
          # to cross compile the whole Luau tree. It is the least proven of the
          # six; turn it off here if it breaks and the platform keeps the
          # fallback server.
          # The analyzer is off here: the cross link of the sealed dll
          # runs with x64 defaults and drops every export. The platform
          # keeps the fallback server, as the note above says.
          - asset: larvae-windows-aarch64
            target: aarch64-pc-windows-msvc
            runs-on: windows-latest
            analyzer: false
            native: false
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(matrix.target, 'musl') }}
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The musl build runs inside rust:alpine, where g++ targets musl
      # natively and no third party toolchain download exists to fail. The
      # container holds only the build; checkout and upload run on the host,
      # because JavaScript actions do not run in an Alpine container on an
      # arm runner. The explicit --target keeps proc macros off crt-static,
      # which is the documented alpine quirk.
      # Both packages are named outright. A bare `cargo build` follows
      # `default-members`, and a release that silently stopped building the
      # server would look exactly like a release that built it.
      - name: Build
        if: contains(matrix.target, 'musl')
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -c '
            set -eu
            apk add --no-cache g++ make
            rustup target add ${{ matrix.target }} >/dev/null 2>&1 || true
            cargo build --release --locked --target ${{ matrix.target }} \
              -p larvae -p larvae-lsp ${{ matrix.analyzer && '--features larvae-lsp/analyzer' || '' }}
          '

      - name: Build
        if: ${{ !contains(matrix.target, 'musl') }}
        run: >
          cargo build --release --locked --target ${{ matrix.target }}
          -p larvae -p larvae-lsp
          ${{ matrix.analyzer && '--features larvae-lsp/analyzer' || '' }}

      # A server that answers hover proves the C++ actually went in. Without
      # this the analyzer feature could quietly stop compiling in and every
      # release after would ship the fallback while the build stayed green.
      #
      # Only a binary the runner can execute is probed. Two of the six are
      # built for another architecture, and those rely on the build itself
      # failing when the C++ does not cross compile.
      - name: Check the server carries the analyzer
        if: ${{ matrix.analyzer && matrix.native }}
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/larvae-lsp${{ runner.os == 'Windows' && '.exe' || '' }}"

          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":null}}'
          printf 'Content-Length: %d\r\n\r\n%s' "${#body}" "$body" | "$BIN" > caps.txt || true

          if ! grep -q '"hoverProvider"' caps.txt; then
            echo "larvae-lsp was built without the analyzer: no hoverProvider" >&2
            cat caps.txt >&2
            exit 1
          fi

          echo "the analyzer is in: hoverProvider is advertised"

      # The archive takes the asset name, the binary inside keeps its own, so
      # `self update` knows what to pull out no matter which one it downloaded.
      # Both binaries travel together. The editor extension looks for
      # `larvae-lsp` beside the `larvae` it resolved, and an archive with only
      # the CLI gives every user the fallback server. `self update` picks
      # `larvae` out by its exact name, so the second file does not confuse it.
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          OUT="target/${{ matrix.target }}/release"

          # The analyzer lives in a shared library that the server finds
          # through an rpath of $ORIGIN, so it has to be in the archive with
          # it. Without it the server does not fall back, it refuses to
          # start, and the editor gives up after five restarts.
          FILES=("$OUT/larvae" "$OUT/larvae-lsp")

          for lib in "$OUT"/libeclipse_analysis.*; do
            [ -e "$lib" ] && FILES+=("$lib")
          done

          zip -j -9 "${{ matrix.asset }}.zip" "${FILES[@]}"
          unzip -l "${{ matrix.asset }}.zip"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "target\${{ matrix.target }}\release"
          $files = @("$out\larvae.exe", "$out\larvae-lsp.exe")

          # A platform without the analyzer has no library, and appending
          # the empty lookup puts a null in the list Compress-Archive reads.
          $lib = Get-ChildItem "$out\*eclipse_analysis*" -ErrorAction SilentlyContinue
          if ($lib) { $files += $lib.FullName }

          Compress-Archive -DestinationPath "${{ matrix.asset }}.zip" -Path $files
          Expand-Archive -Path "${{ matrix.asset }}.zip" -DestinationPath check -Force
          Get-ChildItem check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes
          fi

          gh release upload "$TAG" dist/*.zip --clobber

  crates:
    name: Publish to crates.io
    needs: [verify, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The verify job already proved the tag equals the Cargo.toml version,
      # so what publishes here is always the version the tag names. A crate
      # whose version is already on crates.io is skipped, so a re-run of a
      # partly failed release publishes only what is missing. larvae-worm
      # goes first: a worm author needs the guest crate at the version the
      # host speaks.
      - name: Publish what this version is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_SECRET }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          for CRATE in larvae-worm larvae; do
            if curl -fsS -A "larvae-release" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" >/dev/null 2>&1; then
              echo "${CRATE} ${VERSION} is already on crates.io, skipping"
              continue
            fi

            cargo publish -p "$CRATE" --locked --token "$CARGO_REGISTRY_TOKEN"
          done
