name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and publish
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Cheap and first: a tag that disagrees with Cargo.toml would publish the
  # wrong version to crates.io, where it cannot be taken back.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="larvae") | .version')

          if [ "$TAG" != "v$VERSION" ]; then
            echo "tag $TAG does not match Cargo.toml version $VERSION" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.asset }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          # asset is what `self update` looks for, it is larvae-{os}-{arch}
          # spelled exactly as std::env::consts reports them at runtime
          - asset: larvae-linux-x86_64
            target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
          - asset: larvae-linux-aarch64
            target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-24.04-arm
          - asset: larvae-macos-x86_64
            target: x86_64-apple-darwin
            runs-on: macos-latest
          - asset: larvae-macos-aarch64
            target: aarch64-apple-darwin
            runs-on: macos-latest
          - asset: larvae-windows-x86_64
            target: x86_64-pc-windows-msvc
            runs-on: windows-latest
          # The runner is x86_64 and the target is not, so MSVC cross
          # compiles this one.
          - asset: larvae-windows-aarch64
            target: aarch64-pc-windows-msvc
            runs-on: windows-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !contains(matrix.target, 'musl') }}
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The musl build runs inside rust:alpine, where g++ targets musl
      # natively and no third party toolchain download exists to fail. The
      # container holds only the build; checkout and upload run on the host,
      # because JavaScript actions do not run in an Alpine container on an
      # arm runner. The explicit --target keeps proc macros off crt-static,
      # which is the documented alpine quirk.
      # The package is named outright, so a change to `default-members`
      # cannot change what a release ships.
      - name: Build
        if: contains(matrix.target, 'musl')
        run: |
          docker run --rm -v "$PWD:/work" -w /work rust:alpine sh -c '
            set -eu
            apk add --no-cache g++ make
            rustup target add ${{ matrix.target }} >/dev/null 2>&1 || true
            cargo build --release --locked --target ${{ matrix.target }} -p larvae
          '

      - name: Build
        if: ${{ !contains(matrix.target, 'musl') }}
        run: cargo build --release --locked --target ${{ matrix.target }} -p larvae

      # The archive takes the asset name, the binary inside keeps its own, so
      # `self update` knows what to pull out no matter which one it downloaded.
      - name: Package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          zip -j -9 "${{ matrix.asset }}.zip" "target/${{ matrix.target }}/release/larvae"
          unzip -l "${{ matrix.asset }}.zip"

      - name: Package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -DestinationPath "${{ matrix.asset }}.zip" -Path "target\${{ matrix.target }}\release\larvae.exe"
          Expand-Archive -Path "${{ matrix.asset }}.zip" -DestinationPath check -Force
          Get-ChildItem check

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [verify, build]
    runs-on: ubuntu-latest
    steps:
      # The schema ships as a release asset, so an editor or a tool can
      # fetch the schema that matches a version and not only the one on
      # master. The checkout is at the tag for that reason.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
          sparse-checkout: crates/larvae/larvae.schema.json
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail

          # A tag with a prerelease suffix, ex: v0.7.6-canary, is an
          # in-dev build: GitHub marks it Pre-release so nobody takes it
          # for the current version, and crates.io never sees it.
          prerelease=""
          case "$TAG" in
            *-*) prerelease="--prerelease" ;;
          esac

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "$TAG" --generate-notes $prerelease
          fi

          gh release upload "$TAG" dist/*.zip crates/larvae/larvae.schema.json --clobber

  crates:
    name: Publish to crates.io
    needs: [verify, release]
    # A prerelease tag builds and lands on GitHub, and stops there. A
    # version on crates.io cannot be taken back, so an in-dev build does
    # not spend one.
    if: ${{ !contains(needs.verify.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Each crate publishes at the version its own Cargo.toml states. The
      # tag names the version of larvae and larvae-worm; eclipse_luau keeps
      # a version of its own. A crate whose version is already on crates.io
      # is skipped, so a re-run of a partly failed release publishes only
      # what is missing. eclipse_luau goes first, because larvae depends on
      # it. larvae-worm goes next: a worm author needs the guest crate at
      # the version the host speaks.
      - name: Publish what this version is missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_SECRET }}
        run: |
          set -euo pipefail

          for CRATE in eclipse_luau larvae-worm larvae; do
            VERSION=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .version')

            if curl -fsS -A "larvae-release" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" >/dev/null 2>&1; then
              echo "${CRATE} ${VERSION} is already on crates.io, skipping"
              continue
            fi

            cargo publish -p "$CRATE" --locked --token "$CARGO_REGISTRY_TOKEN"

            # The next crate depends on this one, and the index takes a moment.
            for attempt in $(seq 1 30); do
              if curl -fsS -A "larvae-release" "https://crates.io/api/v1/crates/${CRATE}/${VERSION}" >/dev/null 2>&1; then
                break
              fi
              echo "waiting for ${CRATE} ${VERSION} to appear on crates.io (${attempt})"
              sleep 10
            done
          done
