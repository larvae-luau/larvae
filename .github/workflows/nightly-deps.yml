# The nightly that keeps the analyzer's inputs current, the same job
# luau-lsp runs for itself: move the Luau pin when upstream releases, and
# refresh the Roblox global types. Each lands as a pull request that CI
# validates; nothing reaches master on its own.

name: Nightly deps

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  luau-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Find the latest Luau release
        id: latest
        run: |
          TAG=$(curl -fsS -A larvae-nightly https://api.github.com/repos/luau-lang/luau/releases/latest | jq -r .tag_name)
          PIN=$(tr -d '[:space:]' < crates/larvae-lsp/luau.pin)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "pin=$PIN" >> "$GITHUB_OUTPUT"
          echo "current pin $PIN, latest $TAG"

      - name: Move the pin
        if: steps.latest.outputs.tag != steps.latest.outputs.pin
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          git -C crates/larvae-lsp/luau fetch --tags origin
          git -C crates/larvae-lsp/luau checkout "refs/tags/$TAG"
          printf '%s\n' "$TAG" > crates/larvae-lsp/luau.pin
          sed -i "s/release \*\*${{ steps.latest.outputs.pin }}\*\*/release **$TAG**/" crates/larvae-lsp/VENDORED.md || true

      - name: Build the analyzer against the new pin
        if: steps.latest.outputs.tag != steps.latest.outputs.pin
        run: cargo build --locked -p larvae-lsp --features analyzer

      - name: Open the pull request
        if: steps.latest.outputs.tag != steps.latest.outputs.pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.latest.outputs.tag }}"
          BRANCH="chore/luau-pin-$TAG"
          if gh pr list --head "$BRANCH" --json number --jq length | grep -qv '^0$'; then
            echo "a pull request for $TAG already waits"; exit 0
          fi
          git config user.name "larvae-nightly"
          git config user.email "nightly@larvae.invalid"
          git checkout -b "$BRANCH"
          git add crates/larvae-lsp/luau crates/larvae-lsp/luau.pin crates/larvae-lsp/VENDORED.md
          git commit -m "chore(deps): move the luau pin to $TAG

          The nightly found a newer upstream release and built the analyzer
          against it. The submodule, the pin file, and the vendor note move
          together."
          git push -u origin "$BRANCH"
          gh pr create --fill --base master

  global-types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Four security levels, and each is a whole API surface. The one
      # without a suffix is RobloxScriptSecurity, which the analyzer
      # loads unless a project names another.
      - name: Fetch the latest Roblox global types
        id: fetch
        run: |
          mkdir -p crates/larvae-lsp/types
          base=https://raw.githubusercontent.com/JohnnyMorganz/luau-lsp/main/scripts
          found=true

          for name in globalTypes.d.luau globalTypes.None.d.luau \
            globalTypes.LocalUserSecurity.d.luau globalTypes.PluginSecurity.d.luau; do
            if ! curl -fsS -A larvae-nightly -o "/tmp/$name" "$base/$name"; then
              found=false
              echo "$name did not answer; skipping the run"
            fi
          done

          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Open the pull request when the types moved
        if: steps.fetch.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for name in globalTypes.d.luau globalTypes.None.d.luau \
            globalTypes.LocalUserSecurity.d.luau globalTypes.PluginSecurity.d.luau; do
            cp "/tmp/$name" "crates/larvae-lsp/types/$name"
          done
          # The shapes upstream has not shipped yet; a no-op once it does.
          python3 scripts/patch_global_types.py
          if git diff --quiet; then
            echo "the types have not moved"; exit 0
          fi
          BRANCH="chore/global-types-$(date +%F)"
          if gh pr list --head "$BRANCH" --json number --jq length | grep -qv '^0$'; then
            echo "a pull request already waits"; exit 0
          fi
          git config user.name "larvae-nightly"
          git config user.email "nightly@larvae.invalid"
          git checkout -b "$BRANCH"
          git add crates/larvae-lsp/types/globalTypes.d.luau
          git commit -m "chore(deps): refresh the Roblox global types

          The nightly pulled the current globalTypes.d.luau, the same file
          luau-lsp generates from the Roblox API dump."
          git push -u origin "$BRANCH"
          gh pr create --fill --base master
