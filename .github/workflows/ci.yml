name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: Format & Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    # Windows is in the matrix on purpose: path handling (emitted requires,
    # mount mapping, re-relativized $paths) is a known cross-platform bug
    # class for this tool category.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace --all-targets
      - name: Unit & integration tests
        run: cargo test --workspace
      - name: Parser conformance
        # corpus round trip, coverage, mutation and truncation sweeps. The
        # suite moved to eclipse_luau with the parser it exercises.
        run: cargo test -p eclipse_luau --test parser

      - name: Parser agrees with Luau
        # Recorded verdicts of the real Luau parser, so this needs no Luau.
        # scripts/parser_oracle.sh makes the recording and checks it again.
        run: cargo test -p larvae --test parser_oracle

  # The shim only compiles where someone builds with the feature, and nothing
  # else in CI does. Without this job the C++ could stop compiling and every
  # check would stay green until a release tried to build it.
  analyzer:
    name: Analyzer build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: analyzer
      - name: Build larvae-lsp with the vendored Luau
        run: cargo build -p larvae-lsp --features larvae-lsp/analyzer

      - name: The server answers with the analyzer capabilities
        shell: bash
        run: |
          set -euo pipefail

          body='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"rootUri":null}}'
          printf 'Content-Length: %d\r\n\r\n%s' "${#body}" "$body" \
            | target/debug/larvae-lsp > caps.txt || true

          for want in hoverProvider completionProvider signatureHelpProvider inlayHintProvider; do
            if ! grep -q "\"$want\"" caps.txt; then
              echo "the analyzer build does not advertise $want" >&2
              cat caps.txt >&2
              exit 1
            fi
          done

          echo "the analyzer build advertises every capability that needs it"

  smoke:
    name: CLI smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release
      - name: End-to-end CLI run on a fixture project
        shell: bash
        run: |
          set -euo pipefail
          BIN="$PWD/target/release/larvae"
          FIXTURE="$(mktemp -d)"
          cd "$FIXTURE"
          mkdir -p src/shared src/server Packages
          cat > default.project.json <<'EOF'
          {
            "name": "smoke",
            "tree": {
              "$className": "DataModel",
              "ReplicatedStorage": {
                "shared": { "$path": "src/shared" },
                "Packages": { "$path": "Packages" }
              },
              "ServerScriptService": { "$path": "src/server" }
            }
          }
          EOF
          cat > larvae.toml <<'EOF'
          [aliases]
          pkg = "@game/ReplicatedStorage/Packages"
          EOF
          echo 'return {}' > Packages/signal.luau
          echo 'return {}' > src/shared/util.luau
          printf 'local S = require("@pkg/signal")\nlocal u = require("../shared/util")\nreturn { S, u }\n' > src/server/boot.luau

          "$BIN" process
          "$BIN" check

          grep -F 'require("@game/ReplicatedStorage/Packages/signal")' dist/server/boot.luau
          grep -F 'require("@game/ReplicatedStorage/shared/util")' dist/server/boot.luau
          grep -F '"../dist/shared"' .larvae/build.project.json
          grep -F '"../Packages"' .larvae/build.project.json

          # Idempotence: processing our own output must be a no-op.
          cp dist/server/boot.luau src/server/boot.luau
          "$BIN" process
          grep -F 'require("@game/ReplicatedStorage/Packages/signal")' dist/server/boot.luau

          # Failure paths must fail: unknown alias exits non-zero.
          echo 'return require("@nope/x")' > src/shared/bad.luau
          if "$BIN" check; then
            echo "expected check to fail on unknown alias" >&2
            exit 1
          fi
