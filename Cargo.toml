[package]
name = "larvae"
version = "0.1.0"
edition = "2024"
description = "One toolchain for all of Luau: transforms today, formatting and linting next, in one parallel Rust binary"
license = "MIT"
repository = "https://github.com/larvae-luau/larvae"
homepage = "https://github.com/larvae-luau/larvae"
keywords = ["luau", "roblox", "toolchain", "rojo", "require"]
categories = ["development-tools::build-utils", "command-line-utilities"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE.md",
    "CHANGELOG.md",
    "larvae.schema.json",
    "assets/larvae.png",
]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
globset = "0.4"
json5 = "0.4"
notify-debouncer-full = "0.7.0"
rayon = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
self-replace = "1"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
terminal_size = "0.4"
toml = { version = "0.8", default-features = false, features = ["parse"] }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
walkdir = "2"
xxhash-rust = { version = "0.8.18", features = ["xxh3"] }
zip = { version = "8.6.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Cold path crates, none of these run per file so they trade speed for size
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.rustls]
opt-level = "z"
[profile.release.package.ring]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.notify]
opt-level = "z"
[profile.release.package.notify-debouncer-full]
opt-level = "z"
[profile.release.package.json5]
opt-level = "z"
[profile.release.package.pest]
opt-level = "z"
[profile.release.package.self-replace]
opt-level = "z"
[profile.release.package.semver]
opt-level = "z"
[profile.release.package.zip]
opt-level = "z"
[profile.release.package.flate2]
opt-level = "z"
[profile.release.package.miniz_oxide]
opt-level = "z"
[profile.release.package.zlib-rs]
opt-level = "z"

[workspace]
members = ["."]
exclude = ["fuzz"]

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
winreg = "0.55"
