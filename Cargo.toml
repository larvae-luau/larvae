[workspace]
resolver = "3"
members = ["crates/larvae", "crates/larvae-worm"]
# fuzz needs nightly, the fixture worm only builds for wasm32
exclude = ["crates/larvae/fuzz", "crates/larvae/tests/fixtures/echo-worm"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/larvae-luau/larvae"
homepage = "https://github.com/larvae-luau/larvae"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Cold path crates, none of these run per file so they trade speed for size
[profile.release.package.ureq]
opt-level = "z"
[profile.release.package.rustls]
opt-level = "z"
[profile.release.package.ring]
opt-level = "z"
[profile.release.package.rustls-webpki]
opt-level = "z"
[profile.release.package.clap_builder]
opt-level = "z"
[profile.release.package.notify]
opt-level = "z"
[profile.release.package.notify-debouncer-full]
opt-level = "z"
[profile.release.package.json5]
opt-level = "z"
[profile.release.package.pest]
opt-level = "z"
[profile.release.package.self-replace]
opt-level = "z"
[profile.release.package.semver]
opt-level = "z"
[profile.release.package.zip]
opt-level = "z"
[profile.release.package.flate2]
opt-level = "z"
[profile.release.package.miniz_oxide]
opt-level = "z"
[profile.release.package.zlib-rs]
opt-level = "z"
[profile.release.package.wasmi]
opt-level = "z"
[profile.release.package.wasmi_core]
opt-level = "z"
[profile.release.package.wasmi_ir]
opt-level = "z"
[profile.release.package.wasmi_collections]
opt-level = "z"
[profile.release.package.wasmparser]
opt-level = "z"
[profile.release.package.toml]
opt-level = "z"
[profile.release.package.sha2]
opt-level = "z"
[profile.release.package.dirs]
opt-level = "z"
[profile.release.package.url]
opt-level = "z"
[profile.release.package.idna]
opt-level = "z"
