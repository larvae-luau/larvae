# Every key larvae reads today, with the default shown where there is one.
# Nothing here is required: `larvae fmt` and `larvae lint` work with no config
# at all, and `larvae process` needs at most [process] and [requires].
#
# Not committed, this file is a reference. `larvae init` writes a short one.


# --- top level ---------------------------------------------------------------
# TOML reads a root key only before the first table header, so these come
# first.

# A base config that this file layers over, by path relative to this file.
# The base loads first and this file wins key by key. A monorepo keeps its
# shared twenty lines in one base this way.
# extends = "./shared/larvae.base.toml" The three keys every project sets have short forms at the root. Each
# one means the same as its long spelling further down; write one spelling,
# both at once is an error.
#
# input = "src"                          # short for [process] input
# output = "dist"                        # short for [process] output
# target = "roblox-string"               # short for [requires] target

# Globs relative to the project root that every command skips: process, fmt,
# lint, and the editor. `include` cancels `exclude` here, and only that. The
# include of one area is stronger: it also cancels for that area.
# exclude = ["Packages"]
# include = ["Packages/keep.luau"]


# --- aliases -----------------------------------------------------------------
# Merged over .luaurc per key, so a project with a .luaurc needs none of this.
# The value is a DataModel path or a filesystem path. Names are matched case
# insensitively. "@self" and "@game" are reserved.

[aliases]
pkg = "@game/ReplicatedStorage/Packages"
shared = "./src/shared"


# --- process -----------------------------------------------------------------
# What is read, where it is written, how it is printed.

[process]
input = "src"                            # or a list: ["src/client", "src/shared"]
output = "dist"
include = ["**/*.luau", "**/*.lua"]      # relative to the project root, picks what is transformed
# exclude = ["**/*.spec.luau"]           # relative to the project root, skipped entirely
generator = "retain-lines"               # or "dense" (minified, see [minify]), or "readable" (formatted)
quotes = "preserve"                      # quotes on rewritten require strings
strip_flags = true                       # drop `-- larvae: allow(...)` comments
cache = true                             # incremental builds by content hash
cache_dir = ".larvae"
run_order = 1                            # where our rules sit relative to worms


# --- requires ----------------------------------------------------------------
# The rewriter. Everything else in this file is optional; this is the part
# most projects came for.

[requires]
target = "roblox-string"                 # or "path" (Lune), or "roblox-instance"
strict = false                           # missing target file becomes an error
instance_input = true                    # read require(script.Parent.X) as input
# sourcemap = "sourcemap.json"           # Rojo's file to instance map, when you have one

# Only when target = "roblox-instance": how emitted chains index children.
# indexing_style = "wait_for_child"      # or "find_first_child", "property"

# Fallback filesystem to DataModel mapping. Rarely needed: a Rojo project file
# already says this, and larvae reads it.
[requires.mounts]
"src/shared" = "@game/ReplicatedStorage/shared"
"src/server" = "@game/ServerScriptService"

# A different target for the paths a glob matches, relative to [process].input.
# First match wins. Value is a target name, or a table naming the indexing style.
[requires.overrides]
"legacy/**" = "roblox-instance"
"tools/**" = { target = "path" }


# --- rojo --------------------------------------------------------------------

[rojo]
# project = "default.project.json"       # found by name when unset
# build_project = ".larvae/build.project.json"


# --- defines -----------------------------------------------------------------
# Compile time constants. The name is replaced by the literal everywhere it
# appears as a global, then the folding rules get to work on the result.
# Worth overriding per profile, see the bottom of this file.

[defines]
DEBUG = true
VERSION = "1.4.2"
MAX_PLAYERS = 32


# --- rules -------------------------------------------------------------------
# Every one is off unless it is named here. larvae's own first, then the
# darklua parity set under the same names darklua uses.

[rules]

# larvae's own
const_requires = true                    # local X = require(...) becomes const X
use_get_service = true                   # game.Players becomes game:GetService("Players")
dedupe_requires = true                   # two top level requires of one module become one
freeze_module = true                     # table.freeze on a returned literal, when nothing writes to it
add_luau_directive = "strict"            # writes --!strict, an explicit one in the source wins
inject_module_path = "MODULE_PATH"       # a constant at the top holding this file's path

# true, or a table naming what to keep
remove_comments = { except = ["^--!", "^-- Copyright"] }

# a list, or a table that also sets the side effect switch
remove_calls = { functions = ["print", "warn", "debug.profilebegin"], preserve_arguments_side_effects = true }

# text, or file = "banner.txt", and exactly one of the two
append_text_comment = { text = "generated by larvae, do not edit", location = "start" }

# darklua parity
compute_expression = true                # fold 2 + 2, when it prints back exactly
convert_index_to_field = true            # t["field"] becomes t.field
convert_luau_number = true               # 0b1010 becomes hex, digit separators go
convert_square_root_call = true          # math.sqrt(x) becomes (x ^ 0.5)
filter_after_early_return = true         # drop what a `do return end` made unreachable
group_local_assignment = true            # merge a run of adjacent locals
remove_assertions = true
remove_debug_profiling = true
remove_empty_do = true
remove_nil_declaration = true            # local x = nil becomes local x
remove_unused_if_branch = true           # prune a branch with a constant condition
remove_unused_variable = true
remove_unused_while = true               # while false do ... end goes
remove_function_call_parens = false      # f("x") becomes f"x", requires included

# true removes every attribute, or a table matching some of them
remove_attribute = { match = ["^native$"] }

# true, or a table naming the strategy: "string" or "tostring"
remove_interpolated_string = { strategy = "string" }

# Downlevelling, for a runtime older than Luau. Off here because each one makes
# the output less like the source, which is the opposite of what most projects
# want from a Roblox build.
convert_function_to_assignment = false   # function foo() becomes foo = function()
convert_local_function_to_assign = false
remove_compound_assignment = false       # x += 1 becomes x = x + 1
remove_continue = false                  # rewrites the loop into repeat ... until true
remove_floor_division = false            # a // b becomes math.floor(a / b)
remove_if_expression = false             # if c then a else b becomes c and a or b
remove_method_call = false               # obj:m(x) becomes obj.m(obj, x)
remove_method_definition = false         # function C:m() becomes function C.m(self)
remove_types = false                     # strips every annotation
rename_variables = false                 # short names, for a minified build
make_assignment_local = false            # the inverse of const_requires


# --- fmt ---------------------------------------------------------------------
# `larvae fmt`. Every stylua option under its own name, so a stylua.toml can be
# pasted in here and deleted. A stylua.toml still in the project is read first
# and these layer over it.

[fmt]
column_width = 120
line_endings = "unix"                    # or "windows"
indent_type = "tabs"                     # or "spaces"
indent_width = 4
quote_style = "auto-prefer-double"       # auto-prefer-single, force-double, force-single, preserve
call_parentheses = "always"              # no-single-string, no-single-table, none, input
space_after_function_names = "never"     # definitions, calls, always
collapse_simple_statement = "never"      # function-only, conditional-only, always
block_newline_gaps = "never"             # or "preserve", keeps a blank line at the edge of a block

# past stylua
magic_trailing_comma = true              # a trailing comma means "keep this expanded"
space_inside_braces = true               # { a } rather than {a}
space_inside_parens = false              # f( a ) rather than f(a)
space_inside_brackets = false            # t[ k ] rather than t[k]
trailing_comma = true                    # a table that broke keeps its last comma

exclude = ["Packages", "**/*.gen.luau"]  # relative to the project root
# syntax = "Luau"                        # accepted from stylua, and ignored

[fmt.sort_requires]
enabled = false
grouping = "flat"                        # or "by-kind": aliases, absolute, relative


# --- lint --------------------------------------------------------------------
# `larvae lint`. selene's names work here too, so a selene.toml can be pasted
# in. A selene.toml still in the project is read first and these layer over it.

[lint]
std = "roblox"                           # or "luau", "none", or a selene name like "lua53"
globals = ["shared", "_TESTING"]         # names the project defines itself
exclude = ["Packages", "**/*.spec.luau"] # relative to the project root

# A level for a whole kind of lint. It sits between `recommended` and
# [lint.rules]: a name below always wins, and a group covers every lint the
# project did not name. A group does not wake a lint that is `allow` on
# purpose, so `style = "info"` leaves `prefer_const` off.
#
# The table is separate from [lint.rules] on purpose. A table in there is the
# lints of a worm of that name, and nothing reserves a worm name.
# A level is allow, info, warn or deny. `info` reports and leaves the exit
# code alone, exactly as `warn` does; an editor draws it as a hint rather than
# a squiggle. Only `deny` fails a run.
[lint.groups]
performance = "info"                     # the six kinds: correctness, suspicious,
complexity = "allow"                     # style, complexity, performance, roblox

# A lint keeps its own default until it is named here. Sixty three of them;
# `larvae lint --explain <name>` describes one. These are the defaults: six
# deny, eleven allow, and the other forty six warn.
#
# A lint denies when the code cannot be what the author meant and no reading
# of it makes the finding wrong. Then the build stops. Everything softer
# warns, and a matter of taste is allow until the project asks for it.
#
# Larvae covers all 28 lints of the Luau compiler, and `larvae init` turns
# Luau's own off in .luaurc. Each one keeps the level that Luau gives it, so
# the change of linter changes no report.
[lint.rules]
undefined_variable = "deny"              # the name is nil, and the line throws
duplicate_keys = "deny"                  # the first entry is discarded
duplicate_local = "deny"                 # the first binding is dead on arrival
format_string = "deny"                   # string.format raises on this one
zero_step_loop = "deny"                  # the counter never moves, so it hangs
length_as_condition = "deny"             # `if #t then` is true with an empty table
high_cyclomatic_complexity = "allow"     # a branch count is not a defect on its own
non_const_require = "allow"              # const is newer than most codebases
prefer_const = "allow"                   # a keyword is a bigger edit than a space
multiple_statements = "allow"            # `larvae fmt` splits the line already
implicit_return = "allow"                # a lookup that finds nothing reads well
implicit_any_parameter = "allow"         # most Luau carries no annotations
and_or_conditional = "allow"             # `x = c and a or b`, a matter of taste
if_expression_assignment = "allow"       # the repair misleading_and_or asks for
else_after_return = "allow"              # one level of indent, no more
collapsible_if = "allow"                 # two conditions one `and` apart
negated_condition = "allow"              # `if not x then a else b`
unused_variable = "warn"
shadowing = "warn"
mixed_table = "warn"
implicit_any_local = "warn"
# ... every other lint warns

# Per lint settings. `config` is selene's name for this table, and works too,
# but write one or the other.
[lint.options.unused_variable]
parameters = false                       # a parameter is part of a signature the caller decides
loop_variables = false                   # `for k, v` where only k is wanted is how the language reads
ignore_pattern = "^_"

[lint.options.high_cyclomatic_complexity]
maximum_complexity = 40                  # selene's number

# Silent until this table names a global. Each line is a name and the reason a
# reader is shown, so a bare list would report "restricted" and leave them
# guessing. getfenv and setfenv turn Luau's optimiser off for the function
# that holds them, which is a cost and not a matter of taste.
[lint.options.restricted_globals]
loadstring = "compiles a string at runtime, ship the code instead"
getfenv = "turns the optimiser off for this function"

[lint.options.deprecated]
additional = { "myOldHelper" = "myNewHelper" }

[lint.options.restricted_module_paths]
paths = { "@game/ServerStorage/secrets" = "server only, never require this from shared" }


# --- worms -------------------------------------------------------------------
# Extensions fetched from a GitHub release. (M3)
#
# Commented out because naming one makes larvae go and fetch it, so the names
# have to be real for this file to run.
#
# Everything about one worm lives under its own key: where it comes from, when
# it runs, which of its rules are on, and the settings it reads.
#
# [worms]
# xml = "luau-xml/worm@0.1.0"          # the short form, owner/repo@version
#
# [worms.markup]
# repo = "someone/markup-worm"
# version = "2.1.0"
# asset = "markup-worm.zip"            # defaults to markup-worm.zip, then worm.zip
# run_order = "before"                 # or "after", or a slot number
# rules = { tidy = true }              # this worm's rules, by its own names
#
# [worms.markup.config]
# Whatever the worm documents, handed over untouched. larvae never reads inside
# one, and it is a table of its own so a worm's `repo` key cannot collide with
# the one above that says where to fetch it from.
# pretty = true
# indent = 2
#
# A local worm, which is how its author runs it before publishing:
#
# [worms.mine]
# path = "build/myworm"


# --- check -------------------------------------------------------------------
# The CI gate: whole project questions over the require graph. Each key is a
# level like [lint.rules], and only a deny fails the run. Unresolvable
# requires and realm violations are always reported; no level lowers them.

[check]
cycles = "warn"                          # modules that require each other; the report names the cycle
unused_modules = "allow"                 # modules nothing requires; Scripts and LocalScripts never count
early_require = "warn"                   # roblox-instance only: client requires that do not wait
# entries = ["src/boot.luau"]            # extra entry points, never reported as unused


# --- bundle ------------------------------------------------------------------
# `larvae bundle` writes the project as one file. Modules load on demand, so
# bundling cannot move a side effect.

[bundle]
# entry = "src/init.luau"                # the module the bundle starts from; --entry beats this
# output = "bundle.luau"                 # where the single file goes, relative to the project root
tree_shake = true                        # drop the modules the entry never reaches


# --- minify ------------------------------------------------------------------
# Tuning for generator = "dense". The dense generator re-emits the output
# tokens with the least whitespace that lexes the same, so comments are gone
# and the meaning cannot change. Inert under another generator.

[minify]
column_span = 120                        # break the line near this column, so line numbers stay useful
rename_variables = false                 # short local names while minifying; same rule as [rules] rename_variables


# --- profiles ----------------------------------------------------------------
# The same keys the root has, merged over it when --profile <name> is passed.
# Tables merge per key, arrays and scalars are replaced whole.

[profile.release]
defines = { DEBUG = false }

[profile.release.process]
output = "dist-release"

[profile.release.rules]
remove_comments = true
rename_variables = true

[profile.release.fmt]
column_width = 100

[profile.release.lint.rules]
unused_variable = "deny"

